version: "29.8.0"

services:
  web:
  environment:
    DB_HOST: db
    DB_NAME: ${MARIADB_DATABASE}
    DB__USER:  ${MARIADB_USER}
    DB_PASS: ${MARIADB_PASSWORD}
    
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:11
    env_file: .env
    volumes:
     - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  db_data: